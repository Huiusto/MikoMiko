name: miko_anime
description: "MikoMiko Flutter 规则追番模块"
publish_to: 'none'
version: 0.1.37+37

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rules/
    - assets/images/
    - assets/covers/
  fonts:
    - family: MikoSans
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf





