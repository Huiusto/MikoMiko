<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    background: #ffffff;
    color: #40566b;
  }
  .wrap {
    width: 100%; height: 100%; display: flex; align-items: stretch; justify-content: center;
    padding: 0;
  }
  .card {
    width: 100%; height: 100%;
    background: #ffffff;
    border: 0;
    border-radius: 0;
    padding: 0;
    text-align: center;
    display: flex; align-items: center; justify-content: center;
  }
  .stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #geetest { width: 100%; }
  .loading { display: none; flex-direction: column; align-items: center; gap: 12px; }
  .sub { font-size: 11px; color: #8a9bac; line-height: 1.7; }
  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid #dbeaf9; border-top-color: #4b9cef;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { color: #b2564b; font-size: 12px; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="stage">
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <div class="sub">正在加载验证码…</div>
      </div>
      <div id="geetest" style="display:none"></div>
    </div>
  </div>
</div>
<script>
  const DATA = __DATA__;

  function post(type, payload) {
    const body = Object.assign({ type: type }, payload || {});
    // 直接投递对象，WebView2 会以 JSON 对象送达；宿主同时兼容字符串包裹的旧格式。
    if (window.chrome && chrome.webview) chrome.webview.postMessage(body);
  }

  function showError(message) {
    const loading = document.getElementById('loading');
    loading.style.display = 'flex';
    loading.className = 'error';
    loading.innerHTML = message || '验证码加载失败，请取消后重试';
    post('error', { message: message || '验证码加载失败' });
  }

  function showStage() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('geetest').style.display = 'block';
    post('ready');
  }

  // 直接展开验证面板，避免先出现「点击按钮进行验证」的触发器。
  function openCaptcha(captchaObj) {
    try {
      const radar = document.querySelector('#geetest .geetest_radar_btn');
      if (radar) {
        radar.click();
      } else if (typeof captchaObj.verify === 'function') captchaObj.verify();
      else if (typeof captchaObj.showCaptcha === 'function') captchaObj.showCaptcha();
      else if (typeof captchaObj.show === 'function') captchaObj.show();
    } catch (e) { }
    [300, 700, 1200].forEach(ms => setTimeout(reportSize, ms));
  }

  // 把验证面板自身的 CSS 尺寸回报宿主，窗口只保留面板大小。
  function reportSize() {
    let best = null;
    ['.geetest_fullpage_click_box', '.geetest_panel_box', '.geetest_captcha', '.geetest_holder']
      .forEach(sel => {
        const el = document.querySelector(sel);
        if (!el) return;
        const r = el.getBoundingClientRect();
        if (r.width < 240 || r.height < 240) return;
        if (!best || r.width * r.height > best.width * best.height)
          best = { width: r.width, height: r.height };
      });
    if (best)
      post('size', { data: JSON.stringify({ width: Math.ceil(best.width), height: Math.ceil(best.height) }) });
  }

  function finish(captchaObj, done) {
    if (done.value) return;
    done.value = true;
    let validate = null;
    try { validate = captchaObj.getValidate(); } catch (e) { validate = null; }
    if (!validate) {
      post('close');
      return;
    }
    post('validate', { data: validate });
  }

  // v3 的 onSuccess 会先于面板最终结果落库，TeyvatGuide 也是在 onClose 之后才取
  // getValidate()。这里延后一点再取，避免提交到半成品 validate 导致打卡仍 1034。
  function finishSoon(captchaObj, done, delay) {
    setTimeout(() => finish(captchaObj, done), delay || 300);
  }

  function loadScript(src, readyCheck, onReady, onFail) {
    if (readyCheck()) { onReady(); return; }
    const script = document.createElement('script');
    script.src = src;
    script.async = true;
    const timer = setTimeout(() => onFail('验证码 SDK 加载超时，请检查网络'), 10000);
    script.onload = () => {
      clearTimeout(timer);
      if (readyCheck()) onReady(); else onFail('验证码 SDK 初始化失败');
    };
    script.onerror = () => {
      clearTimeout(timer);
      onFail('验证码 SDK 加载失败，请检查网络');
    };
    document.head.appendChild(script);
  }

  const done = { value: false };

  if (DATA.useV4) {
    loadScript('https://static.geetest.com/v4/gt4.js',
      () => typeof initGeetest4 === 'function',
      () => {
        initGeetest4({
          captchaId: DATA.gt,
          riskType: DATA.riskType || 'slide',
          product: 'popup',
          lang: 'zho',
          userInfo: JSON.stringify({ session_id: DATA.sessionId || '' }),
          https: true,
          protocol: 'https'
        }, function (captchaObj) {
          const host = document.getElementById('geetest');
          host.innerHTML = '';
          captchaObj.appendTo('#geetest');
          captchaObj.onReady(() => { showStage(); openCaptcha(captchaObj); });
          setTimeout(() => { showStage(); openCaptcha(captchaObj); }, 450);
          captchaObj.onSuccess(() => finishSoon(captchaObj, done, 300));
          captchaObj.onClose(() => finish(captchaObj, done));
        });
      },
      showError);
  } else {
    loadScript('https://static.geetest.com/static/js/gt.0.4.9.js',
      () => typeof initGeetest === 'function',
      () => {
        initGeetest({
          gt: DATA.gt,
          challenge: DATA.challenge,
          offline: false,
          new_captcha: true,
          product: 'custom',
          area: '#geetest',
          width: '300px',
          https: true
        }, function (captchaObj) {
          const host = document.getElementById('geetest');
          host.innerHTML = '';
          captchaObj.appendTo('#geetest');
          captchaObj.onReady(() => { showStage(); openCaptcha(captchaObj); });
          setTimeout(() => { showStage(); openCaptcha(captchaObj); }, 450);
          captchaObj.onSuccess(() => finishSoon(captchaObj, done, 300));
          captchaObj.onClose(() => finish(captchaObj, done));
        });
      },
      showError);
  }
</script>
</body>
</html>
